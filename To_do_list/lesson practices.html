      let array2 = ["breakfast", "lunch", "snack", "dinner"];
      function getLastValue(array) {
        let i = array.length - 1;
        return array[i];
      }

      function arraySwap(array) {
        let temp = array[0];
        array[0] = array[array.length - 1];
        array[array.length - 1] = temp;
        let i = 0;
        while (i < array.length) {
          console.log(array[i] + ",");

      addNum(myArray, 12);

      function countPositive(array) {
        let count = 0;
        for (let i = 0; i < array.length; i++) {
          if (array[i] > 0) count++;
          else continue;
        }
        console.log(count + " positive numbers exist in the current array.");
      }
      myArray = [10, 20, 40, 60, 70];
      countPositive(myArray);
      countPositive(array2);
      function minMax(nums) {
        let min = nums[0],
          max = nums[nums.length - 1];
        // let null='null';

        for (let i = 0; i < nums.length; i++) {
          if (nums[i] <= min) min = nums[i];
          else if (nums[i] >= max) max = nums[i];
          else if ((nums.length = 1)) {
            min = nums[i];
            max = nums[i];
          } else {
            let mini = "null";
            let maxi = "null";
          }
        }
        console.log(
          "From the given array: {" +
            nums +
            "} the maximum is {" +
            max +
            "} and the minimum is {" +
            min +
            "}.",
        );
      }
      minMax(myArray);
      minMax([""]);
      minMax([3, 3, 2, 2, 2, 2, 3, 2]);
      function countWords(words) {
        let countElements = [];

        for (let i = 0; i < words.length; i++) {
          let count = 0;
          for (let j = 0; j < words.length; j++) {
            if (words[i] === words[j]) {
              count++;
            }
          }
          if (!countElements.some((element) => element.word === words[i])) {
            countElements.push({ word: words[i], Count: count });
          }
        }
        console.log(countElements);
      }
